# OpenCode Base16 Dark Theme for foot

[colors-dark]
background=0a0a0a
foreground=eeeeee

## Selection
selection-background=505050

## Cursor
cursor=0a0a0a eeeeee

## URL URLs
urls=9d7cd8

## Normal colors (0-7)
