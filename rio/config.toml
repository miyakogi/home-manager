# Theme
theme = "opencode"

# Use fork
#
# Defaults for POSIX-based systems (Windows is not configurable):
# MacOS: spawn processes
# Linux/BSD: fork processes
use-fork = true

confirm-before-quit = false

padding-x = 8
padding-y = [0, 4]

# Environment variables
env-vars = []

[editor]
program = "nvim"
args = []

# Cursor
[effects]
custom-mouse-cursor = false
trail-cursor = false

[cursor]
shape = 'beam'
blinking = true
blinking-interval = 500
ignore-selection-foreground-color = false

# Window configuration
[window]
mode = "Maximized"
opacity = 0.98
decorations = "Disabled"

# Renderer
[renderer]
backend = "Vulkan"
# max-fps = 120
strategy = "Events"

# Fonts
[fonts]
size = 21
family = "Lilex"
# features = ["ss01", "ss02", "ss03", "ss04", "ss05", "ss06", "ss07", "ss08", "ss09", "calt", "liga"]
features = ["cv08", "cv15"]
# features = []
hinting = false
use-drawable-chars = true

# Codepoint-based fallback (bypasses fontconfig fallback)
# Japanese -> IBM Plex Sans JP
symbol-map = [
  # CJK symbols and punctuation: 、。「」etc.
  { start = "3000", end = "303F", font-family = "IBM Plex Sans JP" },
  # Hiragana + Katakana
  { start = "3040", end = "30FF", font-family = "IBM Plex Sans JP" },
  # Katakana phonetic extensions
  { start = "31F0", end = "31FF", font-family = "IBM Plex Sans JP" },
  # CJK unified ideographs extension A
  { start = "3400", end = "4DBF", font-family = "IBM Plex Sans JP" },
  # CJK unified ideographs
  { start = "4E00", end = "9FFF", font-family = "IBM Plex Sans JP" },
  # CJK compatibility ideographs
  { start = "F900", end = "FAFF", font-family = "IBM Plex Sans JP" },
  # Halfwidth and fullwidth forms: ！？etc.
  { start = "FF00", end = "FFEF", font-family = "IBM Plex Sans JP" },
  # Nerd Font icons -> Symbols Nerd Font
  { start = "E000", end = "E0D7", font-family = "Symbols Nerd Font" },
  { start = "E200", end = "E2A9", font-family = "Symbols Nerd Font" },
  { start = "E300", end = "E3E3", font-family = "Symbols Nerd Font" },
  { start = "E5FA", end = "E6BB", font-family = "Symbols Nerd Font" },
  { start = "E700", end = "E8EF", font-family = "Symbols Nerd Font" },
  { start = "EA60", end = "EC84", font-family = "Symbols Nerd Font" },
  { start = "ED00", end = "EFCF", font-family = "Symbols Nerd Font" },
  { start = "F000", end = "F385", font-family = "Symbols Nerd Font" },
  { start = "F400", end = "F533", font-family = "Symbols Nerd Font" },
  # Material Design Icons (supplementary private use area A)
  { start = "F0001", end = "F1AF0", font-family = "Symbols Nerd Font" },
]

[fonts.regular]
# family = "cascadiamono"
# style = "normal"
weight = 300
#
[fonts.bold]
# family = "cascadiamono"
# style = "normal"
weight = 500
#
[fonts.italic]
# family = "cascadiamono"
# style = "italic"
weight = 300
#
[fonts.bold-italic]
# family = "cascadiamono"
# style = "italic"
weight = 500

[hints]
# Characters used for hint labels (should be easy to type)
alphabet = "jfkdls;ahgurieowpq"

# URL hint example
[[hints.rules]]
regex = "(https://|http://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^\u27E8\u27E9`\\\\]+"  # 27E8と27E9は '()'
hyperlinks = true
post-processing = true
persist = false

[hints.rules.action]
action = "Copy"

[hints.rules.mouse]
enabled = true
mods = []

# Scroll
[scroll]
multiplier = 5.0
divider = 1.0

# Navigation
[navigation]
mode = "Plain"  # disable tab
use-split = false

# Shell
[shell]
program = "fish"

# Bindings
[bindings]
keys = [
  # Ctrl+Backspace -> Ctrl+W
  { key = 'back', with = 'control', esc = "\u0017" },
]
