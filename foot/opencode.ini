bright1=e06c75   # bright red
bright2=7fd88f   # bright green
bright3=f5a742   # bright yellow
bright4=fab283   # bright blue
bright5=9d7cd8   # bright magenta
bright6=56b6c2   # bright cyan
bright7=ffffff   # bright white
