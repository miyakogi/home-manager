<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>
  <!-- nixpkgs 867dcbc で unifont がフル配布版になり、fallback のトップに選ばれ
       Nerd Font 等のグリフが tofu 化するため、全ファミリを reject する -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="family">
          <string>Unifont</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont Sample</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont Upper</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont JP Sample</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont T Sample</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont CSUR</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont-JP</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont-T</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont Tsource</string>
        </patelt>
      </pattern>
      <pattern>
        <patelt name="family">
          <string>Unifont Japanese</string>
        </patelt>
      </pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
