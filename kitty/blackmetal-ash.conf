# vim:ft=kitty

## name: Blackmetal-ash
## A desaturated, low-contrast terminal theme.
## Based on waybar/blackmetal.css with foreground softened to ash gray (#c1c1c1)
## for reduced eye strain while keeping the black metal aesthetic.

background #000000
foreground #c1c1c1
selection_background #535353
selection_foreground #c1c1c1
url_color #888888
cursor #c1c1c1

# Tabs
active_tab_background #535353
active_tab_foreground #c1c1c1
inactive_tab_background #000000
inactive_tab_foreground #666666

# Borders
active_border_color #c1c1c1
inactive_border_color #535353

# normal
color0  #000000  # black   → base
color1  #5f8787  # red     → teal-ish
color2  #a06666  # green   → rust
color3  #dd9999  # yellow  → dusty pink
color4  #999999  # blue    → gray
color5  #aaaaaa  # magenta → light gray
color6  #888888  # cyan    → mid gray
color7  #c1c1c1  # white   → ash

# bright
color8  #535353  # bright black    → muted
color9  #5f8787  # bright red      → same as normal
color10 #a06666  # bright green    → same as normal
color11 #dd9999  # bright yellow   → same as normal
color12 #999999  # bright blue     → same as normal
color13 #aaaaaa  # bright magenta  → same as normal
color14 #888888  # bright cyan     → same as normal
color15 #ffffff  # bright white    → pure white (only pure white, for emphasis)
