<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="strong">
    <family>Lilex</family>
    <prefer>
      <family>Lilex</family>
      <family>Symbols Nerd Font</family>
      <family>IBM Plex Sans JP</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Lilex ExtraLight</family>
    <prefer>
      <family>Lilex ExtraLight</family>
      <family>Symbols Nerd Font</family>
      <family>IBM Plex Sans JP ExtLt</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Lilex Light</family>
    <prefer>
      <family>Lilex Light</family>
      <family>Symbols Nerd Font</family>
      <family>IBM Plex Sans JP Light</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Lilex Medium</family>
    <prefer>
      <family>Lilex Medium</family>
      <family>Symbols Nerd Font</family>
      <family>IBM Plex Sans JP Medm</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Lilex SemiBold</family>
    <prefer>
      <family>Lilex SemiBold</family>
      <family>Symbols Nerd Font</family>
      <family>IBM Plex Sans JP SmBld</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Lilex Thin</family>
    <prefer>
      <family>Lilex Thin</family>
      <family>Symbols Nerd Font</family>
      <family>IBM Plex Sans JP Thin</family>
    </prefer>
  </alias>
</fontconfig>
