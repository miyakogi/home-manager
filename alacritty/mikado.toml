# Nightfox Alacritty Colors
## name: carbonfox
## upstream: https://github.com/edeneast/nightfox.nvim/raw/main/extra/carbonfox/alacritty.toml

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
text = "#000000"
cursor = "#f16da6"

[colors.vi_mode_cursor]
text = "#ffffff"
cursor = "#33b1ff"

[colors.search.matches]
foreground = "#ffffff"
background = "#525253"

[colors.search.focused_match]
foreground = "#ffffff"
background = "#3ddbd9"

[colors.footer_bar]
foreground = "#ffffff"
background = "#353535"

[colors.hints.start]
foreground = "#ffffff"
background = "#3ddbd9"

[colors.hints.end]
foreground = "#ffffff"
background = "#353535"

[colors.selection]
text = "#bcbcaf"
background = "#2d4f67"

[colors.normal]
black = "#322a2c"
red = "#d04363"
green = "#9b9329"
yellow = "#bf7a29"
blue = "#6a8c8c"
magenta = "#856774"
cyan = "#757978"
white = "#bcbcaf"

[colors.bright]
black = "#46423b"
red = "#ae837a"
green = "#b4aa30"
yellow = "#c7a551"
blue = "#74999e"
magenta = "#9c818e"
cyan = "#9fa590"
white = "#c1c4bc"
